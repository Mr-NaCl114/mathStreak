server:
  port: 10001
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    max-connections: 20
    threads:
      max: 20
      min-spare: 10
    accept-count: 10
    connection-timeout: 600000
    keep-alive-timeout: 15000
    max-keep-alive-requests: 100

spring:
  main:
    lazy-initialization: true
    banner-mode: off
  jmx:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    mysql:
      # 本地开发连接 Docker MySQL（宿主机端口 3308 映射到容器 3306）
      url: jdbc:mysql://127.0.0.1:3306/mathstreak?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        idle-timeout: 30000
        connection-timeout: 30000
        max-lifetime: 1800000

    pgvector:
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    openai:
      timeout: 120000
      chat:
        model: deepseek-v4-flash
#        model: mimo-v2.5-pro

  data:
    redis:
      # 本地开发连接 Docker Redis
      database: 1

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

